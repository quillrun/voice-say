[build-system]
requires = ["setuptools>=77"]  # the SPDX `license = "MIT"` string
build-backend = "setuptools.build_meta"

[project]
name = "voice-say"
version = "2.0.1"
description = "Local text-to-speech for macOS: a daemon, a library CLI and a searchable audio archive."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "voice-say contributors" },
]
keywords = ["tts", "cli", "audio", "mlx", "kokoro"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    # Audio duration probe — fills the row's duration_s at render time.
    "mutagen>=1.47",
    # TOML config layer — tomllib is stdlib on 3.11+, tomli backports 3.10.
    "tomli>=2.0; python_version < '3.11'",
    # TOML writer — stdlib has no serializer; used by config.write_local to
    # persist default_backend/default_voice from POST /config.
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/quillrun/voice-say"
Issues = "https://github.com/quillrun/voice-say/issues"

[project.optional-dependencies]
dev =["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-aiohttp>=1.0"]

[project.scripts]
voice-say-daemon = "voice_say.http_server:main"
voice-say = "voice_say.cli:main"

[tool.setuptools.packages.find]
include = ["voice_say*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

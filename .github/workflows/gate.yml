name: Publishable Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Publishability check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install daemon package (with dev extras)
        run: pip install -e daemon[dev]

      - name: Run publishable-check
        run: bash scripts/publishable-check.sh
